name: geotag

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geotag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geotag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      # Speeds up first boot; safe for a local dev container only.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - geotag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geotag"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: geotag-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - geotag-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  geotag-postgres-data:
  geotag-redis-data:
